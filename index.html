<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>თამაშების ჩოთქი</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: system-ui, "Noto Sans Georgian", sans-serif;
    background: radial-gradient(circle at top, #23392f, #14211b); color: #f1efe6;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 24px 14px; }
  h1 { text-align: center; color: #f2c14e; margin: 10px 0 24px; }
  a.game {
    display: flex; align-items: center; gap: 16px; padding: 22px 18px; margin-bottom: 14px;
    border-radius: 14px; text-decoration: none; color: inherit; font-size: 1.3rem; font-weight: 700;
    background: linear-gradient(180deg, #26473a, #1f3a2e); box-shadow: 0 4px 14px #0008, inset 0 1px 0 #fff1;
  }
  a.game:active { transform: scale(.98); }
  a.game span.i { font-size: 2.2rem; }
  a.game small { display: block; font-weight: 400; font-size: .85rem; color: #a9c2b5; margin-top: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>თამაშების ჩოთქი</h1>
  <a class="game" href="domino/"><span class="i">🁫</span><span>დომინო<small>2, 3, 4 მოთამაშე ან 2×2</small></span></a>
  <a class="game" href="joker/"><span class="i">🃏</span><span>ჯოკერი<small>ჯოკერის რვეული</small></span></a>
</div>
</body>
</html>
